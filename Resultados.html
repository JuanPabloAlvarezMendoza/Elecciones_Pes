<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultados</title>
<style>
:root{--bg:#ffffff;color-scheme:light;--card:#fff;--tx:#14241a;--mu:#5b6f5f;--bd:#d9e7cf;--g1:#1f5130;--g2:#3f7d3a;--g3:#7fb33b;--lime:#b5d23a;--ok:#2f8f3a;--sh:rgba(31,81,48,.14)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,var(--g1),var(--g2));border-bottom:5px solid;border-image:linear-gradient(90deg,var(--g1),var(--g3),var(--lime)) 1;display:flex;align-items:center;justify-content:center;gap:18px;padding:14px 16px;flex-wrap:wrap;text-align:left}
header .logo{height:78px;width:auto;background:#fff;border-radius:14px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
header h1{margin:0;font-size:1.6rem;color:#fff}
header p{margin:2px 0 0;color:rgba(255,255,255,.88)}
@media(max-width:520px){header{text-align:center;flex-direction:column;gap:8px}}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
button,button.b{border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;transition:.15s}
button:hover:not(:disabled){filter:brightness(1.12)}
button.g{background:var(--card);color:var(--g2);border:1.5px solid var(--g3)}
button:disabled{opacity:.4;cursor:not-allowed}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.tot{font-weight:800;font-size:1.3rem;color:var(--g1)}
.upd{color:var(--mu);font-size:.8rem}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px 18px;margin-bottom:16px;box-shadow:0 4px 14px var(--sh)}
.sec h2{margin:0 0 12px;font-size:1.2rem;color:var(--g2);padding-left:10px;border-left:5px solid var(--lime)}
.row{display:grid;grid-template-columns:minmax(120px,1.4fr) 3fr 40px;gap:10px;align-items:center;margin:8px 0;font-size:.92rem}
.trk{height:16px;background:var(--bd);border-radius:99px;overflow:hidden}
.trk i{display:block;height:100%;background:linear-gradient(90deg,#6aa84f,#9cc653);border-radius:99px;transition:width .5s}
.row.w .trk i{background:linear-gradient(90deg,var(--g1),var(--g3),var(--lime))}
.row.w .n{font-weight:700;color:var(--g1)}
.row b{text-align:right}
.crown{font-size:.75rem;color:#fff;background:var(--ok);border-radius:8px;padding:2px 7px;margin-left:4px;white-space:nowrap}
.msg{text-align:center;color:var(--mu);padding:20px}
@media(max-width:520px){.row{grid-template-columns:1fr 40px}.row .trk{grid-column:1/-1;grid-row:2}}
</style>
</head>
<body>
<header><img class="logo" src="logo.jpg" alt="IEEE PES USCO"><div><h1>Resultados</h1><p>Conteo en vivo · IEEE PES USCO</p></div></header>
<main>
 <div class="top"><div><div class="tot" id="tot">Cargando…</div><div class="upd" id="upd"></div></div><button id="rf">Actualizar</button></div>
 <div id="out"></div>
</main>
<script>
/* ====== EDITA ESTOS DATOS (iguales que en index.html) ====== */
const URL_API="https://script.google.com/macros/s/AKfycbx2Jel5q-tKlC1J_uXuyI4SdYJ6tc_fLJTZf1HMmOdbn7nfoO_Tbf0lbfrqYFGmES1g/exec";
const BLANCO="Voto en blanco";
const RUN={ // quién se postuló a cada cargo (nombres exactos de la lista C)
"Presidente":["Carol Vanessa","Andrés Felipe Vidal Gallego"],
"Vicepresidente":["Carol Vanessa","José David Quintero Oviedo","Jhonnatan Ramírez Caldas","Daniel García Trujillo"],
"Tesorero":["Carol Vanessa","Jhonnatan Ramírez Caldas"],
"Webmaster":["Carol Vanessa"],
"Fiscal":["Carol Vanessa","José Santiago Castro Campos"],
"Secretaria":["Carol Vanessa"]
};
const P=["Presidente","Vicepresidente","Tesorero","Webmaster","Fiscal","Secretaria"];
/* =========================================================== */
async function load(){
 const out=document.getElementById("out");
 try{
  const r=await fetch(URL_API+"?t="+Date.now());
  const d=await r.json();
  document.getElementById("tot").textContent=d.total?("Votos totales: "+d.total):"Aún no hay votos";
  document.getElementById("upd").textContent="Actualizado: "+new Date().toLocaleTimeString("es-CO");
  const tot=d.total||1;
  out.innerHTML=P.map((p,pi)=>{
   const L=RUN[p].concat([BLANCO]),cnt=L.map(n=>(d.counts[pi]||{})[n]||0),max=Math.max(...cnt,0);
   return `<div class="sec"><h2>${p}</h2>`+L.map((n,ci)=>{
    const w=cnt[ci]===max&&max>0;
    return `<div class="row ${w?"w":""}"><div class="n">${n} ${w?'<span class="crown">▲ lidera</span>':""}</div>
    <div class="trk"><i style="width:${cnt[ci]/tot*100}%"></i></div><b>${cnt[ci]}</b></div>`}).join("")+`</div>`}).join("");
 }catch(e){out.innerHTML='<div class="msg">No se pudieron cargar los resultados. Revisa la URL del script.</div>'}
}
document.getElementById("rf").onclick=load;
load();setInterval(load,90000);
</script>
</body>
</html>
