<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votaciones</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2240;--mu:#6b7390;--ac:#4f46e5;--ac2:#7c3aed;--bd:#e3e7f2;--ok:#16a34a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1220;--card:#1a1e33;--tx:#eef0fa;--mu:#9aa2c4;--bd:#2c3253;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;text-align:center;padding:26px 16px 20px;position:relative}
header h1{margin:0 0 4px;font-size:1.7rem}header p{margin:0;opacity:.9}
#cfg{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:10px;padding:6px 10px;cursor:pointer}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s}
.step{color:var(--mu);font-size:.9rem;text-align:center}
h2{text-align:center;font-size:1.6rem;margin:14px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:18px 14px;text-align:center;cursor:pointer;transition:.2s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(79,70,229,.15)}
.card.sel{border-color:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.25)}
.card.sel::after{content:"✓";position:absolute;top:10px;right:10px;background:var(--ok);color:#fff;width:26px;height:26px;border-radius:50%;line-height:26px;font-weight:700}
.ph{width:104px;height:104px;border-radius:50%;margin:0 auto 12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.nm{font-weight:700;font-size:1.02rem;margin-bottom:6px}
.info{font-size:.85rem;color:var(--mu);line-height:1.5}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
button.b{border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:600;cursor:pointer;background:var(--ac);color:#fff}
button.b.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.b:disabled{opacity:.4;cursor:not-allowed}
.rev{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:8px 18px;max-width:560px;margin:0 auto}
.rev div{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}
.rev div:last-child{border:0}.rev span{color:var(--mu)}
.done{text-align:center;padding:40px 10px}.done .big{font-size:3.5rem}
.err{background:#fee2e2;color:#991b1b;border-radius:12px;padding:12px;max-width:560px;margin:14px auto;text-align:center}
dialog{border:0;border-radius:16px;padding:20px;background:var(--card);color:var(--tx);max-width:420px;width:92%}
dialog input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:8px 0 14px}
.intro{max-width:420px;margin:30px auto;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:28px 22px;text-align:center}
.intro .big{font-size:3rem}
.intro input{width:100%;padding:14px;font-size:1.1rem;text-align:center;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);margin:14px 0}
.intro input:focus{outline:0;border-color:var(--ac)}
</style>
</head>
<body>
<header><h1>🗳️ Elecciones del Comité</h1><p>Elige un candidato para cada cargo</p></header>
<main id="app"></main>



<script>
/* ====== EDITA ESTOS DATOS ====== */
const URL_API="https://script.google.com/macros/s/AKfycbx2Jel5q-tKlC1J_uXuyI4SdYJ6tc_fLJTZf1HMmOdbn7nfoO_Tbf0lbfrqYFGmES1g/exec";
const C=[
{n:"José Santiago Castro Campos",s:"—",c:"—",img:""},
{n:"Jhonnatan Ramírez Caldas",s:"—",c:"—",img:""},
{n:"Carol Vanessa",s:"—",c:"—",img:""},
{n:"Daniel García Trujillo",s:"—",c:"—",img:""},
{n:"José David Quintero Oviedo",s:"—",c:"—",img:""},
{n:"Andrés Felipe Vidal Gallego",s:"—",c:"—",img:""}
]; // img: ruta de la foto, ej. "fotos/jose.jpg"
const P=["Presidente","Vicepresidente","Tesorero","Webmaster","Fiscal","Secretaria"];
/* =============================== */

let step=0,votes={},busy=false,error="",started=false,code="";
const app=document.getElementById("app");

const ini=n=>n.split(" ").slice(0,2).map(w=>w[0]).join("");
const ph=i=>C[i].img?`<img src="${C[i].img}" alt="">`:ini(C[i].n);

function render(){
 if(!started)return intro();
 if(step>=P.length)return review();
 const sel=votes[step];
 app.innerHTML=`<div class="step">Cargo ${step+1} de ${P.length}</div>
 <div class="bar"><i style="width:${step/P.length*100}%"></i></div><h2>${P[step]}</h2>
 <div class="grid">${C.map((c,i)=>`<div class="card ${sel===i?"sel":""}" data-i="${i}">
  <div class="ph">${ph(i)}</div><div class="nm">${c.n}</div>
  <div class="info">Semestre: ${c.s}<br>Código: ${c.c}</div></div>`).join("")}</div>
 <div class="nav"><button class="b g" id="bk" ${step?"":"disabled"}>← Atrás</button>
 <button class="b" id="nx" ${sel===undefined?"disabled":""}>${step===P.length-1?"Revisar":"Siguiente →"}</button></div>`;
 app.querySelectorAll(".card").forEach(e=>e.onclick=()=>{votes[step]=+e.dataset.i;render()});
 document.getElementById("bk").onclick=()=>{step--;render()};
 document.getElementById("nx").onclick=()=>{step++;render()};
}
function intro(){
 app.innerHTML=`<div class="intro"><div class="big">🎓</div><h2 style="margin:6px 0">Bienvenido</h2>
 <p style="color:var(--mu);margin:0">Ingresa tu código de estudiante para poder votar. Solo se permite un voto por código.</p>
 <input id="cd" inputmode="numeric" autocomplete="off" placeholder="Tu código" value="${code}">
 ${error?`<div class="err" style="margin:0 0 12px">${error}</div>`:""}
 <button class="b" id="go" style="width:100%" ${busy?"disabled":""}>${busy?"Verificando…":"Comenzar"}</button></div>`;
 const inp=document.getElementById("cd");
 inp.onkeydown=e=>{if(e.key==="Enter")document.getElementById("go").click()};
 document.getElementById("go").onclick=async()=>{
  code=inp.value.trim();error="";
  if(!/^[A-Za-z0-9]{4,15}$/.test(code)){error="Escribe un código válido (solo letras y números).";return intro()}
  if(URL_API.startsWith("PEGA")){error="Falta pegar la URL del script en el archivo index.html.";return intro()}
  busy=true;intro();
  try{
   const r=await fetch(URL_API+"?check="+encodeURIComponent(code)+"&t="+Date.now());
   const j=await r.json();busy=false;
   if(j.voted){error="Este código ya votó.";return intro()}
   started=true;error="";render();
  }catch(e){busy=false;error="No se pudo conectar con el servidor ("+e.message+"). Revisa la URL del script y que la implementación sea para “Cualquier persona”.";intro()}
 };
}
function review(){
 app.innerHTML=`<div class="bar"><i style="width:100%"></i></div><h2>Confirma tu voto</h2>
 <div class="rev">${P.map((p,i)=>`<div><span>${p}</span><b>${C[votes[i]].n}</b></div>`).join("")}</div>
 ${error?`<div class="err">${error}</div>`:""}
 <div class="nav" style="max-width:560px;margin-inline:auto"><button class="b g" id="bk">← Corregir</button><button class="b" id="ok" ${busy?"disabled":""}>${busy?"Guardando…":"Emitir voto ✓"}</button></div>`;
 document.getElementById("bk").onclick=()=>{error="";step=P.length-1;render()};
 document.getElementById("ok").onclick=send;
}

async function send(){
 busy=true;error="";review();
 try{
  const r=await fetch(URL_API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({code:code,v:P.map((_,i)=>C[votes[i]].n)})});
  const j=await r.json();
  if(!j.ok){busy=false;if(j.error==="duplicado"){started=false;error="Este código ya votó.";return render()}throw new Error(j.error||"Error al guardar")}
  busy=false;done();
 }catch(e){busy=false;error="No se pudo guardar el voto: "+e.message;review()}
}
function done(){
 app.innerHTML=`<div class="done"><div class="big">🎉</div><h2>¡Voto registrado!</h2>
 <div class="nav" style="justify-content:center"><button class="b" id="nw">Nuevo votante</button><a href="resultados.html"><button class="b g">Ver resultados</button></a></div></div>`;
 document.getElementById("nw").onclick=()=>{step=0;votes={};started=false;code="";render()};
}
render();
</script>
</body>
</html>
