<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votaciones</title>
<style>
:root{--bg:#ffffff;color-scheme:light;--card:#fff;--tx:#14241a;--mu:#5b6f5f;--bd:#d9e7cf;--g1:#1f5130;--g2:#3f7d3a;--g3:#7fb33b;--lime:#b5d23a;--ok:#2f8f3a;--sh:rgba(31,81,48,.14)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,var(--g1),var(--g2));border-bottom:5px solid;border-image:linear-gradient(90deg,var(--g1),var(--g3),var(--lime)) 1;display:flex;align-items:center;justify-content:center;gap:18px;padding:14px 16px;flex-wrap:wrap;text-align:left}
header .logo{height:78px;width:auto;background:#fff;border-radius:14px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
header h1{margin:0;font-size:1.6rem;color:#fff}
header p{margin:2px 0 0;color:rgba(255,255,255,.88)}
@media(max-width:520px){header{text-align:center;flex-direction:column;gap:8px}}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
button,button.b{border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;transition:.15s}
button:hover:not(:disabled){filter:brightness(1.12)}
button.g{background:var(--card);color:var(--g2);border:1.5px solid var(--g3)}
button:disabled{opacity:.4;cursor:not-allowed}

.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--lime));transition:width .3s}
.step{color:var(--mu);font-size:.9rem;text-align:center}
h2{text-align:center;font-size:1.7rem;margin:14px 0 18px;color:var(--g1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:12px;text-align:center;cursor:pointer;transition:.2s;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 24px var(--sh);border-color:var(--g3)}
.card.sel{border-color:var(--ok);box-shadow:0 0 0 4px rgba(127,179,59,.35)}
.card.sel::after{content:"✓";position:absolute;top:18px;right:18px;background:var(--ok);color:#fff;width:30px;height:30px;border-radius:10px;line-height:30px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.ph{width:100%;aspect-ratio:1/1;border-radius:16px;margin:0 0 12px;background:linear-gradient(135deg,var(--g1),var(--g2) 60%,var(--g3));color:#fff;display:flex;align-items:center;justify-content:center;font-size:2.6rem;font-weight:700;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.nm{font-weight:700;font-size:1.02rem;margin-bottom:6px}
.info{font-size:.85rem;color:var(--mu);line-height:1.5;padding-bottom:4px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.rev{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:8px 18px;max-width:560px;margin:0 auto}
.rev div{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}
.rev div:last-child{border:0}.rev span{color:var(--mu)}
.done{text-align:center;padding:40px 10px}.done .big{font-size:3.5rem}
.err{background:#fde8e8;color:#9b1c1c;border-radius:12px;padding:12px;max-width:560px;margin:14px auto;text-align:center}
.intro{max-width:420px;margin:30px auto;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:28px 22px;text-align:center;box-shadow:0 10px 30px var(--sh)}
.intro .big{font-size:3rem}
.intro input{width:100%;padding:14px;font-size:1.1rem;text-align:center;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);margin:14px 0}
.intro input:focus{outline:0;border-color:var(--g3)}
.card.blank .ph{background:#e8eee4;color:#7b8c7f}
.card.blank{border-style:dashed}
</style>
</head>
<body>
<header><img class="logo" src="logo.jpg" alt="IEEE PES USCO"><div><h1>Elecciones del Comité</h1><p>IEEE PES · USCO Student Branch</p></div></header>
<main id="app"></main>



<script>
/* ====== EDITA ESTOS DATOS ====== */
const URL_API="https://script.google.com/macros/s/AKfycbx2Jel5q-tKlC1J_uXuyI4SdYJ6tc_fLJTZf1HMmOdbn7nfoO_Tbf0lbfrqYFGmES1g/exec";
const C=[
{n:"José Santiago Castro Campos",s:"Décimo",c:"20221204327",img:"fotos/Jose_santiago.jpeg"},
{n:"Jhonnatan Ramírez Caldas",s:"Décimo",c:"20221205120",img:"fotos/Jhonnatan.jpeg"},
{n:"Carol Vanessa Garcia Sanchez",s:"Octavo",c:"20231213601",img:"fotos/Carol.jpeg"},
{n:"Daniel García Trujillo",s:"Noveno",c:"20222208587",img:"fotos/Daniel.jpeg"},
{n:"José David Quintero Oviedo",s:"Séptimo",c:"20232217161",img:"fotos/Jose_david.jpeg"},
{n:"Andrés Felipe Vidal Gallego",s:"Séptimo",c:"20232217222",img:"fotos/Andres_felipe.jpeg"},
{n:"Keila Jireh Sanchez Avilez",s:"Octavo",c:"20231210419",img:"fotos/Keila.jpeg"}
]; // img: ruta de la foto, ej. "fotos/jose.jpg"
const P=["Presidente","Vicepresidente","Tesorero","Webmaster","Fiscal","Secretaria"];
const BLANCO="Voto en blanco";
const RUN={ // quién se postuló a cada cargo (nombres exactos de la lista C)
"Presidente":["Carol Vanessa Garcia Sanchez","Andrés Felipe Vidal Gallego"],
"Vicepresidente":["Carol Vanessa Garcia Sanchez","José David Quintero Oviedo","Jhonnatan Ramírez Caldas","Daniel García Trujillo"],
"Tesorero":["Carol Vanessa Garcia Sanchez","Jhonnatan Ramírez Caldas"],
"Webmaster":["Carol Vanessa Garcia Sanchez","Keila Jireh Sanchez Avilez],
"Fiscal":["Carol Vanessa Garcia Sanchez","José Santiago Castro Campos"],
"Secretaria":["Carol Vanessa Garcia Sanchez"]
};
const norm=t=>String(t).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const opts=p=>RUN[p].map(n=>C.find(c=>norm(c.n)===norm(n))||{n:n,s:"—",c:"—",img:""}).concat([{n:BLANCO,blank:true}]);
/* =============================== */

let step=0,votes={},busy=false,error="",started=false,code="",pname="";
const app=document.getElementById("app");

const ini=n=>n.split(" ").slice(0,2).map(w=>w[0]).join("");
const ph=c=>c.blank?"○":c.img?`<img src="${c.img}" alt="">`:ini(c.n);

function render(){
 if(!started)return intro();
 if(step>=P.length)return review();
 const sel=votes[step],O=opts(P[step]);
 app.innerHTML=`<div class="step">Cargo ${step+1} de ${P.length}</div>
 <div class="bar"><i style="width:${step/P.length*100}%"></i></div><h2>${P[step]}</h2>
 <div class="grid">${O.map((c,i)=>`<div class="card ${c.blank?"blank":""} ${sel===c.n?"sel":""}" data-i="${i}">
  <div class="ph">${ph(c)}</div><div class="nm">${c.n}</div>
  <div class="info">${c.blank?"No apoyo a ningún candidato":`Semestre: ${c.s}<br>Código: ${c.c}`}</div></div>`).join("")}</div>
 <div class="nav"><button class="b g" id="bk" ${step?"":"disabled"}>← Atrás</button>
 <button class="b" id="nx" ${sel===undefined?"disabled":""}>${step===P.length-1?"Revisar":"Siguiente →"}</button></div>`;
 app.querySelectorAll(".card").forEach(e=>e.onclick=()=>{votes[step]=O[+e.dataset.i].n;render()});
 document.getElementById("bk").onclick=()=>{step--;render()};
 document.getElementById("nx").onclick=()=>{step++;render()};
}
function intro(){
 const q=t=>t.replace(/"/g,"&quot;");
 app.innerHTML=`<div class="intro"><div class="big">🗳️</div><h2 style="margin:6px 0">Bienvenido</h2>
 <p style="color:var(--mu);margin:0 0 8px">Ingresa tu nombre y tu código de estudiante para votar. Solo se permite un voto por código.</p>
 <input id="nm" type="text" autocomplete="name" maxlength="60" placeholder="Tu nombre completo" style="margin:6px 0" value="${q(pname)}">
 <input id="cd" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="15" placeholder="Tu código (solo números)" style="margin:6px 0 14px" value="${q(code)}">
 ${error?`<div class="err" style="margin:0 0 12px">${error}</div>`:""}
 <button class="b" id="go" style="width:100%" ${busy?"disabled":""}>${busy?"Verificando…":"Comenzar"}</button></div>`;
 const nm=document.getElementById("nm"),cd=document.getElementById("cd");
 cd.oninput=()=>{cd.value=cd.value.replace(/\D/g,"")};
 [nm,cd].forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")document.getElementById("go").click()});
 document.getElementById("go").onclick=async()=>{
  pname=nm.value.trim().replace(/\s+/g," ");code=cd.value.trim();error="";
  if(pname.length<3){error="Escribe tu nombre completo.";return intro()}
  if(!/^\d{6,15}$/.test(code)){error="El código debe tener solo números.";return intro()}
  if(URL_API.startsWith("PEGA")){error="Falta pegar la URL del script en el archivo index.html.";return intro()}
  busy=true;intro();
  try{
   const r=await fetch(URL_API+"?check="+encodeURIComponent(code)+"&t="+Date.now());
   const j=await r.json();busy=false;
   if(j.voted){error="Este código ya votó.";return intro()}
  }catch(e){busy=false;error="No se pudo conectar con el servidor ("+e.message+"). Revisa la URL del script y que la implementación sea para “Cualquier persona”.";return intro()}
  started=true;error="";render();
 };
}
function review(){
 app.innerHTML=`<div class="bar"><i style="width:100%"></i></div><h2>Confirma tu voto</h2>
 <div class="rev">${P.map((p,i)=>`<div><span>${p}</span><b>${votes[i]}</b></div>`).join("")}</div>
 ${error?`<div class="err">${error}</div>`:""}
 <div class="nav" style="max-width:560px;margin-inline:auto"><button class="b g" id="bk">← Corregir</button><button class="b" id="ok" ${busy?"disabled":""}>${busy?"Guardando…":"Emitir voto ✓"}</button></div>`;
 document.getElementById("bk").onclick=()=>{error="";step=P.length-1;render()};
 document.getElementById("ok").onclick=send;
}

async function send(){
 busy=true;error="";review();
 try{
  const r=await fetch(URL_API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({code:code,name:pname,v:P.map((_,i)=>votes[i])})});
  const j=await r.json();
  if(!j.ok){busy=false;if(j.error==="duplicado"){started=false;error="Este código ya votó.";return render()}throw new Error(j.error||"Error al guardar")}
  busy=false;done();
 }catch(e){busy=false;error="No se pudo guardar el voto: "+e.message;review()}
}
function done(){
 app.innerHTML=`<div class="done"><div class="big">🎉</div><h2>¡Voto registrado!</h2><p style="color:var(--mu)">Gracias por participar.</p></div>`;
}
render();
</script>
</body>
</html>
